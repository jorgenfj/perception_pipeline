# Driver config for `acquire`, the full pipeline. Every section is optional;
# anything omitted falls back to the defaults in app_config.hpp, and any node
# not listed stays at whatever the camera already had.
#

camera:
  # Empty picks the first camera found. Set it once there is more than one rig.
  serial: ""
  timeout_ms: 1000

  reconnect_attempts: -1
  reconnect_backoff_ms: 500
  reconnect_backoff_max_ms: 5000

  # GenICam nodes on the camera node map, applied in this order before
  # acquisition starts. Order matters: ExposureAuto has to be Off before
  # ExposureTime is writable, and geometry has to be set before PayloadSize
  # (and therefore the buffer size) means anything.
  #
  # The sequence form below fixes the order explicitly. A plain map works too
  # and reads better, but leans on yaml-cpp preserving document order.
  features:
    - AcquisitionMode: Continuous
    - TriggerMode: "Off"

    - PixelFormat: BayerRG8
    - Width: 1440
    - Height: 1080
    - OffsetX: 0
    - OffsetY: 0

    - ExposureAuto: "Off"
    - ExposureTime: 8000.0     # microseconds

    - GainAuto: "Off"
    - Gain: 0.0

    - AcquisitionFrameRateEnable: true
    - AcquisitionFrameRate: 7.5

    # GigE link tuning. Jumbo frames need the NIC MTU raised to match, and the
    # throughput limit is what stops the camera outrunning the link.
    - GevSCPSPacketSize: 9000
    # - GevSCPD: 4000
    # - DeviceLinkThroughputLimit: 85000000

    # PTP slave sync -- no-op unless a PTP master (the Jetson, see
    # spinnaker/README.md) is actually reachable; the camera just sits in
    # GevIEEE1588Status=Listening otherwise and free-runs as before.
    - GevIEEE1588: "true"

  # The same, against the transport-layer stream node map.
  #
  # NewestOnly is latest-wins at the driver, matching the rings: the default
  # queues stale frames, so any hiccup leaves the pipeline chewing through a
  # backlog instead of dropping it. It costs a third buffer -- the overwrite
  # modes keep one in hand to swap.
  #
  # StreamBufferCountMode is forced to Manual by the source and cannot be set
  # here: on Auto the engine sizes its own pool and ignores the user buffers,
  # which silently drops the zero-copy path.
  stream_features:
    - StreamBufferHandlingMode: NewestOnly

# Which cameras make up the rig, in stream order. streams[0] is the reference
# eye -- the one the stereo consumer anchors on and the one the viewer shows.
#
# Everything else about the two cameras comes from `camera:` above and applies
# to both: exposure, gain, geometry and PTP are rig-wide, and two cameras
# configured differently are not a stereo pair. Only the serial differs, which
# is why that is all this section carries.
#
# Leave this out entirely for a single-camera run and `camera.serial` is used,
# exactly as before stereo existed. With two entries, set both serials: an empty
# one picks whatever is found first, and the two streams may then swap between
# runs -- which silently swaps left and right.
streams:
  - role: left
    serial: ""
  - role: right
    serial: ""

# Live stereo pairing across the two device rings (pipeline/stereo_consumer.hpp).
#
# Only for a -DPERCEPTION_SOURCE=spinnaker build. The recording source replays a
# single stream by design, and two of them would each rebase timestamps onto
# their own start instant, destroying the shared epoch pairing depends on.
# `acquire` says so and carries on rather than refusing to run.
stereo:
  enabled: true

  # lease_latest() anchors on this stream; the other one is searched for the
  # partner carrying the same instant.
  reference_stream: 0

  # Two frames whose camera timestamps are within this of each other are the
  # same instant. MUST stay strictly under half the frame period -- at or above
  # that bound two different exposures both qualify and pairing stops meaning
  # anything. At the 7.5 Hz configured above, half a period is 66666us, so 500
  # is far inside it. Nothing checks this any more: StereoConsumer trusts the
  # caller, so the bound is yours to keep.
  tolerance_us: 500

  # A partner can still be in flight when the reference frame is published.
  # That is transport jitter, not a sync fault, so wait once before giving up.
  # Watch `late=` on the stereo health line: ones and twos are harmless,
  # climbing means jitter is eating into the frame period.
  retry_attempts: 1
  retry_ms: 2

  # Intrinsics, extrinsics, rectification and baseline. Relative to this file.
  # Its roles are checked against `streams:` above, so the calibration cannot be
  # applied to the wrong eye. Set to "" to pair without one.
  calibration: "stereo_calibration.yaml"

# This source section is only read when -DPERCEPTION_SOURCE=recording, which
# replays an .mcap written by a previous run instead of opening cameras.
source:
  # The .mcap file to replay.
  recording: ""

  # Which image topic feeds the pipeline. `topic` wins if set; otherwise
  # "/<role>/image_raw" is used, and leaving both empty takes the first image
  # topic in the file. A stereo recording holds both eyes; this replays one.
  role: "left"
  topic: ""

  # Replay rate. Above 1.0 this is a load knob as much as a time one -- it
  # raises the frame rate the pipeline has to keep up with.
  speed: 1.0

  # Restart at the end rather than ending the run.
  loop: true

  # Shift timestamps onto the current wall clock, preserving every interval
  # exactly. On, because LatencyProbe measures latency as now - timestamp: with
  # the file's original stamps a recording made last week reports a week of
  # latency and every latency number in the report becomes noise. Turn it off
  # only to push the recorded stamps through verbatim -- they are UTC either
  # way, since the pipeline rebased them before they were written.
  rebase_timestamps: true

  # How long a frame waits for a free ingress slot before it is given up on.
  # Frames dropped here mean the pipeline is slower than the recorded rate,
  # which is a finding rather than something to tune away.
  slot_wait_ms: 500

pipeline:
  # The ingress ring IS the camera's buffer pool on this path, so its depth has
  # to cover full upload latency, not just the grab -- a slot only comes back
  # once its H2D has retired. Too shallow shows up as `timeouts` climbing.
  ingress_depth: 8
  device_depth: 6
  max_consumers: 3
  device_id: 0

  # DeviceWait keeps slot reuse on the stream; HostSync blocks the upload
  # thread until the previous read retires.
  reuse_wait: DeviceWait

  # RoundRobin is required if upload.use_graph is on -- ScanForFree picks slots
  # from runtime lease state, so a graph cannot bake the index.
  write_policy: ScanForFree

# Which consumer owns the device ring's secondary slot:
#   camera   -- raw frames only, no inference (ViewerConsumer)
#   yolo     -- frames with detections drawn on top, synced to the exact
#               frame they were computed from (YoloViewerConsumer)
#   headless -- the same detector with no window (HeadlessYoloConsumer),
#               e.g. for a box with no monitor attached
#   ess      -- the ESS disparity window (EssViewerConsumer). Takes no ring
#               consumer of its own: it drives the stereo pairing, so it needs
#               stereo.enabled, a calibration, and ess.enabled below
viewer: camera

#
# vsync off on purpose: parking the swap until the panel is ready adds up to a
# full refresh period to the very latency this is here to show. Turn it on only
# if you are chasing tearing rather than milliseconds.
#
# The bar reads capture -> ready-to-present, relative to the fastest frame seen
# in the last few seconds. It shows jitter and queueing honestly; it cannot see
# exposure, readout or link transport, so it is not glass-to-glass. For that,
# point the camera at a millisecond stopwatch and photograph screen and monitor
# together.
display:
  window_width: 1440
  window_height: 1080
  vsync: false
  latency_scale_ms: 100.0

upload:
  scratch_slots: 4
  # Needs a transform and RoundRobin; the upload-only path has nothing to
  # capture beyond a single memcpy.
  use_graph: false

yolo:
  engine_path: "models/yolo26m_fp16.engine"
  model_width: 640
  model_height: 640
  conf_threshold: 0.25

# ESS stereo disparity. Needs stereo.enabled and a stereo.calibration: the
# network is handed a rectified pair, and rectification comes from the
# calibration.
#
# Where it runs depends on `viewer:` above. With `viewer: ess` the disparity
# window owns the engine and drives the pairing; otherwise the engine runs from
# the stereo pair callback in acquire_main.cpp and only logs.
ess:
  enabled: true

  # Relative to the executable, like yolo.engine_path.
  engine_path: "models/ess_full_fp16.engine"

  # NVIDIA's prebuilt plugin library, holding the five fused ops the ESS graph
  # is built from (FusedConcatConv3x3 x2, FusedEinsum2Softmax,
  # FusedConcat2*Conv3x3c64 x2). It is loaded before the engine is
  # deserialized; without it the plan fails to load with "Cannot find plugin".
  #
  # Not optional and not shipped in this repo -- it comes down with the model.
  # tools/scripts/build_ess_engine.sh leaves it here, under the same cache the
  # engine was built from, so it stays paired with the export it matches.
  # Absolute, ~-relative, and exe-relative paths all work.
  plugin_path: "~/.cache/perception_pipeline/ess/dnn_stereo_disparity_v4.1.0_onnx/plugins/aarch64/ess_plugins.so"

  # The engine's own preprocessing constants, not a tuning knob. Getting them
  # wrong does not fail -- it quietly degrades every disparity. The defaults are
  # the ImageNet statistics Isaac ROS's ESS uses; check them against whatever
  # you exported.
  normalization:
    mean: [0.485, 0.456, 0.406]
    stddev: [0.229, 0.224, 0.225]
    # What a pixel whose ray leaves the source image gets, in [0, 1] before
    # normalization. The channel mean normalizes to zero, which is the most
    # neutral thing a convolution can be handed.
    no_source_value: 0.449

  # Pinned host slots for the disparity readback. Sized in whole disparity
  # frames -- 960x576 float32 is 2.2MB each -- and shared by every consumer that
  # wants the map on the host, of which the recorder is only the first. A slow
  # consumer costs slots rather than blocking the GPU, so `download: ... drops=`
  # climbing means one held a frame longer than this is deep.
  readback_slots: 4

  # Below this the network says the disparity at that pixel is not to be
  # believed: drawn black by the viewer, flagged in the log line. 0 trusts
  # everything.
  conf_threshold: 0.0

  # --- viewer: ess ------------------------------------------------------------
  # turbo (default) or jet. Both run dark blue far -> red near, the way Isaac
  # ROS's ESS samples read; turbo is the same shape without jet's banding.
  colormap: turbo

  # The colormap's ends, in disparity pixels of the 960x576 grid. Not a
  # constraint on the network -- values outside clamp. Read it as depth:
  # depth = rectified_fx * baseline / disparity, and `acquire` prints the two
  # depths this range works out to at startup. Raise the max to spread the
  # colors over a nearer scene, lower it for a far one.
  display_min_disparity: 0.0
  display_max_disparity: 64.0

# PTP-synchronized capture via GigE Vision Action Commands.
#
# Needs PTP working first: a master on the host (see spinnaker/README.md) and
# `GevIEEE1588: "true"` in camera.features above, which is already set. Cameras
# that are not "Slave" ack NO_REF_TIME and nothing fires.
# Write an MCAP of what this run saw: the camera frames, and the ESS disparity
# computed from them. Off by default -- at 3.5 Hz this is ~18.6 MB/s.
#
# The one recorder in the tree: MCAP, and what -DPERCEPTION_SOURCE=recording
# replays. This one exists because disparity only exists
# here: stereo_view links no CUDA on purpose, so it cannot run the engine.
#
# The messages are CDR-encoded sensor_msgs/Image and stereo_msgs/DisparityImage
# under the "ros2" profile, so `ros2 bag play` and Foxglove open the file
# directly. Timestamps are the cameras' own PTP clock, which counts TAI -- the
# file says so in its metadata, because a reader assuming UTC lands 37s out.
recording:
  enabled: true

  # A timestamped .mcap is created in here per run.
  root: "recordings"

  # Seconds of each topic the recorder holds while the disk catches up. Per
  # topic and scaled by its rate, so one number gives a 3.5Hz camera 7 slots
  # (10.9MB) and a 400Hz sensor 800 (410KB) -- the single shared depth this
  # replaces could not be right for both.
  #
  # Camera frames are COPIED into their budget: the ingress slots are the
  # camera's own DMA targets and holding one starves it. A full budget drops
  # that topic's messages and counts them; the recorder never throttles
  # acquisition, or it would manufacture the gaps it exists to show.
  buffer_seconds: 2.0

  # Ceiling per topic, applied after buffer_seconds -- what stops raising that
  # from reserving a gigabyte. The startup line prints the total reserved.
  #
  # It binds for the image and disparity topics, which reserve a flat 4MiB per
  # message rather than measuring the frame: 16 gives them four slots where
  # buffer_seconds asked for seven, so they hold about a second. Raise this to
  # 32 to get the full two seconds, at 96MiB of buffers instead of 60. The
  # health line's `peak k/depth` is where the depth in force shows up.
  topic_memory_mb: 16

  # mcap chunk size, and so crash exposure in bytes: only whole chunks are
  # readable. The 768KiB default is smaller than one 1.56MB frame.
  chunk_mb: 4

  # How often the open chunk is closed even when not full, bounding the same
  # exposure in time. Page cache, not fsync: survives a crash, not a power cut.
  flush_seconds: 2.0

  # What to record, by topic name. A list rather than a flag per kind, because
  # the set of things worth recording grows and a bool each would not.
  #
  # A name nothing produces stops the run rather than recording silence, so a
  # typo is caught immediately -- and so is asking for /disparity on a build or
  # a viewer mode that has no engine. Images are ~10.9MB/s at 3.5Hz, disparity
  # ~7.7MB/s.
  topics:
    - /left/image_raw
    - /right/image_raw
    - /disparity

  # zstd. The Bayer frames compress little and the disparity compresses well.
  compress: false

action_sync:
  enabled: false

  # Must match ActionDeviceKey / ActionGroupKey / ActionGroupMask on the camera.
  # In per_frame mode these are written to the camera for you; in the default
  # mode set them yourself in camera.features.
  device_key: 1
  group_key: 1
  group_mask: 1

  # false: ONE scheduled AcquisitionStart aligns the start of acquisition, then
  #   each camera free-runs at camera.features.AcquisitionFrameRate. They do not
  #   stay aligned -- that rate is generated from the sensor clock, not the
  #   PTP-disciplined one, so the two crystals walk apart at their ppm
  #   difference and the skew grows without bound. Fine for a short run or a
  #   single camera.
  #
  # true: one scheduled command per frame (TriggerSelector=FrameStart /
  #   TriggerSource=Action0), so every exposure is pinned to a PTP instant and
  #   the sensor crystal only has to hold within one frame period rather than
  #   across the run. This is what keeps a stereo pair synced. acquire writes
  #   the trigger features itself and turns AcquisitionFrameRateEnable off,
  #   overriding camera.features above -- trigger_hz becomes the capture rate.
  #   Costs host-loop timing jitter; the run's `trig` line says whether it is
  #   keeping up.
  per_frame: false

  # per_frame only. 0 falls back to expected_hz, so the rate is stated once.
  trigger_hz: 0.0

  # per_frame only. How far ahead each command is scheduled. Commands in flight
  # is roughly trigger_lead_ms / (1000 / trigger_hz) -- at 7.5 Hz and 100 ms
  # that is under one, but pushing the rate up without bringing this down runs
  # into the camera's ActionQueueSize and shows up as OVERFLOW acks in `trig`.
  trigger_lead_ms: 100.0

  # Scheduled for the next whole second at least this far ahead. Default mode
  # only; per_frame uses trigger_lead_ms.
  lead_time_ms: 500.0

  # Checked against the delivered timestamps. Keep in step with whichever rate
  # is actually in force -- AcquisitionFrameRate above, or trigger_hz when
  # per_frame is on -- or every frame reads as mis-spaced when the only thing
  # wrong is this number.
  expected_hz: 7.5
  check_frames: 60
  tolerance_ms: 2.0

  # GetTimeStamp()'s latch point relative to the trigger is a sensor convention:
  # a camera latching at end-of-exposure reports a start offset equal to
  # ExposureTime, which is not a sync failure. Measure it once and set it here.
  expected_start_offset_ms: 0.0

  # Applying the camera config resets PTP, so the cameras start in "Listening"
  # and need a few Announce intervals before they reach "Slave".
  ptp_wait_ms: 20000
